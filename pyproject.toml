[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-request-meter"
version = "0.1.0"
description = "Request-level token and cost metering hooks for Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "BobDLA"}]
keywords = ["codex", "tokens", "metering", "cost"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/BobDLA/codex-request-meter"

[project.scripts]
codex-request-meter = "codex_request_meter.meter:main"
codex-request-meter-install = "codex_request_meter.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_request_meter = ["data/pricing.json"]
